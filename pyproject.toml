[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpgtools"
version = "0.1.0"
description = "Escudo do mestre: notas das mesas e tela remota para mostrar imagens aos jogadores"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "jinja2", "python-multipart", "pillow", "markdown-it-py", "segno"]

[project.scripts]
rpgtools = "rpgtools.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rpgtools = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
